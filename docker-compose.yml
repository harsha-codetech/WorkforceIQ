services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workforceiq
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_CONFIG: production
      SECRET_KEY: change-this-in-production
      SESSION_COOKIE_SECURE: "0"
      DATABASE_URL: mysql+pymysql://root:root@db:3306/workforceiq?charset=utf8mb4
    ports:
      - "5000:5000"
    command: >
      sh -c "flask --app wsgi seed-demo &&
             gunicorn --bind 0.0.0.0:5000 --workers 3 wsgi:app"

volumes:
  db_data:
