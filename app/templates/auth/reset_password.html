{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Set new password{% endblock %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center vh-100" style="background:linear-gradient(135deg,#16243b,#2d72d9);">
  <div class="card shadow-lg" style="width:400px;">
    <div class="card-body p-4">
      <h4 class="fw-bold text-primary mb-3">Choose a new password</h4>
      <form method="post" novalidate>
        {{ form.hidden_tag() }}
        {{ field(form.password) }}
        {{ field(form.confirm) }}
        <div class="d-grid">{{ form.submit(class="btn btn-primary") }}</div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
