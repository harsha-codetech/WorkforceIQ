{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block auth_content %}
<div class="d-flex flex-column align-items-center justify-content-center vh-100 text-center">
  <h1 class="display-1 fw-bold text-primary">{{ code }}</h1>
  <p class="fs-5 text-secondary">{{ message }}</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">Back to safety</a>
</div>
{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-3 fw-bold text-primary">{{ code }}</h1>
  <p class="fs-5 text-secondary">{{ message }}</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">Back to dashboard</a>
</div>
{% endblock %}
